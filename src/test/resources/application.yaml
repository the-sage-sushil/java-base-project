spring:
  datasource:
    url: jdbc:h2:mem:base_project_test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    database-platform: org.hibernate.dialect.H2Dialect
  flyway:
    enabled: false

jwt:
  secret: test-only-secret-key-with-at-least-32-bytes
  expiration: 900000

app:
  security:
    auth-rate-limit:
      requests: 1000
      window: 1m
